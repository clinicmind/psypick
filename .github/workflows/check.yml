name: validate-data

# T1-2：每次 push 到 main 時跑 tools/validate.py。
# 這一階段只報告，不擋部署（部署仍由 Cloudflare Workers Builds 處理）。

on:
  push:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Prepare previous-commit data dir
        run: |
          mkdir -p /tmp/prev
          git archive HEAD~1 site/data 2>/dev/null | tar -x -C /tmp/prev || echo "no previous data dir"

      - name: Run validate.py
        run: |
          MSG="$(git log -1 --format=%B)"
          if [ -d /tmp/prev/site/data ]; then
            python3 tools/validate.py --data-dir site/data --prev-dir /tmp/prev/site/data --message "$MSG"
          else
            python3 tools/validate.py --data-dir site/data --message "$MSG"
          fi
